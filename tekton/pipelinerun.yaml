apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: cd-pipeline-run
spec:
  pipelineRef:
    name: cd-pipeline
  serviceAccountName: cd-deployer
  params:
    - name: repo-url
      value: https://github.com/pavanmundhe/devops-capstone-project.git
    - name: branch
      value: main
    - name: image
      value: cluster-registry:5000/accounts:1.0
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
