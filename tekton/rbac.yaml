apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-deployer
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cd-deployer
subjects:
  - kind: ServiceAccount
    name: cd-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cd-deployer
